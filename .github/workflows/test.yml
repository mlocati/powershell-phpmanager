name: Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  powershell:
    name: PowerShell
    runs-on: windows-latest
    steps:
      - name: Initialize
        shell: powershell
        run: |
          $ErrorActionPreference = 'stop'
          if (Test-Path -PathType Container -LiteralPath C:\tools\php) {
            Remove-Item -Force -Recurse -LiteralPath C:\tools\php
          }
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        shell: powershell
        run: .\test\setup.ps1
      - name: Test
        shell: powershell
        run: |
          $pesterResult = .\test\pester.ps1
          if ($pesterResult.FailedCount -ne 0) {
            throw "$($pesterResult.FailedCount) tests failed!"
          }
  powershellcore:
    name: PowerShell Core
    runs-on: windows-latest
    steps:
      - name: Initialize
        shell: pwsh
        run: |
          $ErrorActionPreference = 'stop'
          if (Test-Path -PathType Container -LiteralPath C:\tools\php) {
            Remove-Item -Force -Recurse -LiteralPath C:\tools\php
          }
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        shell: pwsh
        run: .\test\setup.ps1
      - name: Test
        shell: pwsh
        run: |
          $pesterResult = .\test\pester.ps1
          if ($pesterResult.FailedCount -ne 0) {
            throw "$($pesterResult.FailedCount) tests failed!"
          }
  docker:
    strategy:
      matrix:
        include:
          - name: nanoserver
            shell: pwsh.exe
          - name: windowsservercore
            shell: powershell.exe
      fail-fast: false
    name: Docker (${{ matrix.name }})
    # Windows containers need a base image matching the host kernel: see the FROM lines in test/Dockerfile.*
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Prepare files for Docker image
        run: .\test\Prepare-Dockerfile.ps1 "${{ matrix.name }}"
      - name: Build Docker image
        run: docker build --tag phpmanager/test .\test\docker-build
      - name: Test
        run: |
          docker run --rm --user ContainerAdministrator --volume "$($Env:GITHUB_WORKSPACE):C:\App" --workdir C:\App --env "PM_TEST_DOCKER=1" phpmanager/test ${{ matrix.shell }} -Command '$pesterResult = .\test\pester.ps1; exit $pesterResult.FailedCount'
          $failCount = $LASTEXITCODE
          if ($failCount -ne 0) {
            throw "$failCount tests failed!"
          }
